workflows:
  fitalia-apk:
    name: Fitalia Traslados APK
    max_build_duration: 60
    environment:
      node: 20
      java: 17
    scripts:
      - name: Instalar dependencias
        script: npm install
      - name: Agregar plataforma Android
        script: npx cap add android || echo "android ya existe"
      - name: Sincronizar
        script: npx cap sync android
      - name: Inyectar permisos de ubicacion/segundo plano en el Manifest
        script: F=android/app/src/main/AndroidManifest.xml; grep -q ACCESS_BACKGROUND_LOCATION $F || sed -i.bak 's|</manifest>|<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION"/></manifest>|' $F
      - name: Generar icono de la app (F + camion)
        script: |
          npm i -D @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor '#005BB9' --iconBackgroundColorDark '#003D8F'
      - name: Compilar APK debug
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
