<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#005BB9" />
<title>Fitalia · Traslados</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"Fitalia Traslados","short_name":"Traslados","start_url":".","display":"standalone","background_color":"%23005BB9","theme_color":"%23005BB9"}' />
<style>
  :root{--brand:#005BB9;--brand-d:#003D8F;--brand-l:#E8F1FB;--dark:#0F172A;--text:#393939;
    --muted:#64748B;--line:#E2E8F0;--bg:#F1F5F9;--ok:#0E9F6E;--okbg:#E6F6EF;--amber:#F59E0B;
    --amberbg:#FEF3DD;--bad:#DC2626;--badbg:#FBE9E9;--card:#fff;}
  *{box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);display:flex;flex-direction:column;min-height:100vh}
  .top{background:var(--brand);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10}
  .logo{width:34px;height:34px;border-radius:9px;background:#fff;color:var(--brand);font-weight:900;display:grid;place-items:center;font-size:19px}
  .top .t1{font-size:11px;opacity:.9;line-height:1.1}.top .t2{font-size:15px;font-weight:800;line-height:1.2}
  .top .who{margin-left:auto;text-align:right;font-size:11px;opacity:.95}
  .wrap{flex:1;padding:16px;max-width:560px;width:100%;margin:0 auto}
  h2{font-size:18px;color:var(--brand-d);margin:2px 0 4px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 15px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:11px}
  label{display:block;font-size:12.5px;font-weight:700;margin:0 0 6px}
  input,select{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:12px;font-size:15px;background:#fff;margin-bottom:12px}
  .btn{width:100%;border:0;border-radius:13px;padding:15px;font-size:15px;font-weight:800;cursor:pointer;margin-bottom:10px}
  .btn.brand{background:var(--brand);color:#fff}.btn.ok{background:var(--ok);color:#fff}.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--text)}
  .btn:disabled{opacity:.45}
  .big{display:flex;align-items:center;gap:13px;text-align:left;padding:17px}
  .big .ic{font-size:26px}.big .tt{font-weight:800;font-size:16px}.big .ss{font-size:12px;font-weight:600}
  .btn.brand .ss{color:#DCE7F5}.btn.ghost .ss{color:var(--muted)}
  .gnum{font-weight:800;color:var(--dark);font-size:15px}.gsuc{color:var(--brand);font-weight:700;font-size:13px;margin-top:1px}
  .gmeta{color:var(--muted);font-size:12px;margin-top:4px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .pill{background:var(--bg);border-radius:20px;padding:3px 10px;font-size:11px;color:var(--text);font-weight:600}
  .chk{display:flex;gap:12px;align-items:flex-start}
  .box{width:24px;height:24px;border-radius:7px;border:2px solid #CBD5E1;flex:none;margin-top:1px;display:grid;place-items:center;color:#fff;font-size:15px;transition:.12s}
  .chk.sel .box{background:var(--ok);border-color:var(--ok)}.chk.sel{outline:2px solid var(--ok);outline-offset:-1px;border-radius:12px}
  .suchead{display:flex;align-items:center;gap:8px;margin:14px 2px 8px}
  .sucdot{width:11px;height:11px;border-radius:50%}.sucname{font-weight:800;color:var(--dark);font-size:15px}
  .tag{font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px;margin-left:auto}
  .tag.pend{background:var(--amberbg);color:#b97400}.tag.ok{background:var(--okbg);color:#065F46}
  .foto{border:2px dashed #CBD5E1;background:#fff;border-radius:12px;padding:18px;text-align:center;color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;margin-bottom:12px}
  .foto.ok{border-style:solid;border-color:var(--ok);background:var(--okbg);color:#065F46}
  .foto img{max-width:100%;border-radius:9px;margin-top:8px;max-height:150px}
  .banner{border-radius:12px;padding:12px;font-size:13px;font-weight:600;margin-bottom:12px}
  .banner.info{background:var(--brand-l);color:var(--brand-d)}.banner.ok{background:var(--okbg);color:#065F46}.banner.err{background:var(--badbg);color:#991B1B}
  .gtibox{border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:9px}
  .nav{display:flex;border-top:1px solid var(--line);background:#fff;position:sticky;bottom:0}
  .nav button{flex:1;border:0;background:none;padding:10px 6px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
  .nav button .ni{font-size:20px}.nav button.on{color:var(--brand)}
  .toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:12px 18px;border-radius:11px;font-size:13px;font-weight:600;opacity:0;transition:.25s;z-index:50;max-width:90%;text-align:center}
  .toast.show{opacity:1}
  .spin{display:inline-block;width:16px;height:16px;border:2.5px solid #fff;border-top-color:transparent;border-radius:50%;animation:s .7s linear infinite;vertical-align:-3px;margin-right:6px}
  @keyframes s{to{transform:rotate(360deg)}}
  .center{min-height:70vh;display:flex;flex-direction:column;justify-content:center}
  .hidden{display:none}
</style>
</head>
<body>
  <div class="top">
    <div class="logo">F</div>
    <div><div class="t1">FITALIA REPUESTOS</div><div class="t2" id="topTit">Traslados</div></div>
    <div class="who" id="who"></div>
  </div>
  <div class="wrap" id="app"></div>
  <div class="nav hidden" id="nav"></div>
  <div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===== CONFIG ===== */
const SUPABASE_URL='https://heqofwmvqskwbsysdlxl.supabase.co';
const SUPABASE_KEY='sb_publishable_kADwAb6Re6zqcYg7Qq9EAA_Vp8UVrYz';
const SUC_COLOR={'Brasil':'#005BB9','Gran Avenida':'#0E9F6E','Diez de Julio':'#F59E0B','CD Conchalí':'#8B5CF6'};
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=(s)=>document.querySelector(s), app=()=>$('#app');
let usuario=null, perfil=null, ruta=null, tras=[], sel=new Set(), disp=[];

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}
function esc(s){return (s??'').toString().replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}
function hora(ts){if(!ts)return '—';return new Date(ts).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});}
// GPS: en la app nativa usa el plugin de Capacitor (pide permiso y usa el chip GPS).
// En el navegador (Netlify/PWA) usa navigator.geolocation tomando la mejor lectura en ~7 s.
async function gps(){
  const Geo=(window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Geolocation)||null;
  if(Geo){
    try{
      await Geo.requestPermissions();
      const p=await Geo.getCurrentPosition({enableHighAccuracy:true,timeout:10000,maximumAge:0});
      return {lat:+p.coords.latitude.toFixed(6),lon:+p.coords.longitude.toFixed(6),precision:Math.round(p.coords.accuracy||0)};
    }catch(e){ return {lat:null,lon:null,precision:null}; }
  }
  return new Promise(res=>{
    if(!navigator.geolocation) return res({lat:null,lon:null,precision:null});
    let best=null, id=null, done=false;
    const finish=()=>{ if(done) return; done=true; try{ if(id!=null) navigator.geolocation.clearWatch(id); }catch(_){}
      res(best?{lat:+best.coords.latitude.toFixed(6),lon:+best.coords.longitude.toFixed(6),precision:Math.round(best.coords.accuracy||0)}:{lat:null,lon:null,precision:null}); };
    try{
      id=navigator.geolocation.watchPosition(p=>{
        if(!best || (p.coords.accuracy||9999) < (best.coords.accuracy||9999)) best=p;
        if(p.coords.accuracy && p.coords.accuracy<=15) finish();
      }, ()=>{ if(!best) finish(); }, {enableHighAccuracy:true, timeout:12000, maximumAge:0});
    }catch(_){ finish(); }
    setTimeout(finish, 7000);
  });
}
async function subirFoto(file,prefijo){
  const path=(ruta?.id||'tmp')+'/'+prefijo+'_'+Date.now()+'.jpg';
  const {error}=await sb.storage.from('fotos-traslados').upload(path,file,{contentType:file.type||'image/jpeg',upsert:true});
  if(error) throw error; return path;
}
function grupos(){const g={};tras.forEach(t=>{(g[t.sucursal]=g[t.sucursal]||[]).push(t);});return g;}
function sucEntregada(s){return grupos()[s]?.every(t=>t.estado==='recepcionado');}

/* ===== SESIÓN ===== */
async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(session){ usuario=session.user; await cargarPerfil(); await cargarRutaAbierta(); ruta?go('tareas'):go('home'); }
  else renderLogin();
}
async function cargarPerfil(){
  const {data}=await sb.from('perfiles').select('nombre,rol').eq('id',usuario.id).single();
  perfil=data||{nombre:usuario.email,rol:'chofer'};
  $('#who').innerHTML='Chofer<br><b>'+esc(perfil.nombre)+'</b>';
}
async function cargarRutaAbierta(){
  const {data}=await sb.from('rutas').select('*').eq('chofer_id',usuario.id).eq('estado','en_curso').order('creado_en',{ascending:false}).limit(1);
  ruta=(data&&data[0])||null; if(ruta) await cargarTraslados();
}
async function cargarTraslados(){
  const {data}=await sb.from('traslados').select('*').eq('ruta_id',ruta.id).order('creado_en');
  tras=data||[];
}
function renderLogin(){
  $('#who').innerHTML=''; $('#nav').classList.add('hidden');
  app().innerHTML=`<div class="center"><h2>Iniciar sesión</h2><p class="sub">Ingresa con el usuario de la empresa.</p>
    <div class="card"><label>Usuario (correo)</label><input id="email" type="email" placeholder="roberto@fitalia.cl"/>
    <label>Contraseña</label><input id="pass" type="password" placeholder="••••••"/>
    <div id="lerr" class="banner err hidden"></div><button class="btn brand" id="entrar">Entrar</button></div></div>`;
  $('#entrar').onclick=login; $('#pass').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
}
async function login(){
  const email=$('#email').value.trim(), password=$('#pass').value, b=$('#entrar');
  b.disabled=true; b.innerHTML='<span class="spin"></span>Entrando…';
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  if(error){const e=$('#lerr');e.textContent='Usuario o contraseña incorrectos.';e.classList.remove('hidden');b.disabled=false;b.textContent='Entrar';return;}
  usuario=data.user; await cargarPerfil(); await cargarRutaAbierta(); ruta?go('tareas'):go('home');
}

/* ===== NAVEGACIÓN ===== */
let vista='home';
const TIT={home:'Menú principal',select:'Seleccionar GTI',resumen:'Resumen de ruta',tareas:'Tareas',entrega:'Entrega',cierre:'Ruta completada'};
function go(v){ vista=v; render(); }
function render(){
  $('#topTit').textContent=TIT[v0()]||'Traslados';
  ({home:scHome,select:scSelect,resumen:scResumen,tareas:scTareas,entrega:scEntrega,cierre:scCierre}[v0()])();
  renderNav();
}
function v0(){return vista.split(':')[0];}
function renderNav(){
  const n=$('#nav');
  if(v0()==='home'&&!ruta){ n.classList.remove('hidden');
    n.innerHTML=`<button class="on"><span class="ni">🏠</span>Home</button><button onclick="go('select')"><span class="ni">🚚</span>Nueva ruta</button>`; return; }
  if(!usuario){ n.classList.add('hidden'); return; }
  n.classList.remove('hidden');
  n.innerHTML=`<button class="${v0()==='home'?'on':''}" onclick="go('home')"><span class="ni">🏠</span>Home</button>
    <button class="${['tareas','entrega'].includes(v0())?'on':''}" onclick="go('${ruta?'tareas':'home'}')"><span class="ni">📋</span>Tareas</button>`;
}

/* ===== HOME ===== */
function scHome(){
  const pend=ruta?Object.keys(grupos()).filter(s=>!sucEntregada(s)).length:0;
  app().innerHTML=`<h2>Hola, ${esc((perfil?.nombre||'').split(' ')[0]||'chofer')} 👋</h2><p class="sub">¿Qué quieres hacer?</p>
    ${ruta?`<button class="btn brand big" onclick="go('tareas')"><span class="ic">🚚</span><span><span class="tt">Continuar ruta en curso</span><br><span class="ss">Retoma tu ruta activa</span></span></button>`:''}
    <button class="btn ghost big" onclick="go('${ruta?'tareas':'home'}')" ${ruta?'':'disabled'}><span class="ic">📋</span><span><span class="tt">Tareas pendientes${ruta?` (${pend})`:''}</span><br><span class="ss">${ruta?'Entregas por hacer en ruta':'Sin ruta activa'}</span></span></button>
    <button class="btn ${ruta?'ghost':'brand'} big" onclick="nuevaTarea()"><span class="ic">➕</span><span><span class="tt">${ruta?'Tomar más GTI':'Nueva tarea'}</span><br><span class="ss">${ruta?'Sumar GTI a tu ruta actual':'Elegir GTI e iniciar una ruta'}</span></span></button>
    <button class="btn ghost" style="margin-top:10px" onclick="salir()">Cerrar sesión</button>`;
}
function nuevaTarea(){ go('select'); }
async function salir(){ await sb.auth.signOut(); location.reload(); }

/* ===== SELECCIÓN MÚLTIPLE ===== */
async function scSelect(){
  app().innerHTML=`<h2>¿Qué GTI te llevas?</h2><p class="sub">Marca todas las que cargarás. Pueden ser de varias sucursales.</p>
    <div style="position:sticky;top:0;z-index:6;background:var(--bg);padding:6px 0 10px">
      <button class="btn brand" id="cont" disabled onclick="go('resumen')" style="margin:0">Continuar con <span id="n">0</span> GTI →</button>
    </div>
    <div id="lista"><div class="card" style="text-align:center;color:var(--muted)"><span class="spin" style="border-color:#94A3B8;border-top-color:transparent"></span> Cargando GTI disponibles…</div></div>`;
  const {data,error}=await sb.from('gti_disponibles').select('*').eq('tomada',false).order('fecha_creacion_gti',{ascending:false}).limit(150);
  const l=$('#lista'); if(!l) return;
  if(error){l.innerHTML=`<div class="banner err">${esc(error.message)}</div>`;return;}
  disp=data||[];
  if(!disp.length){l.innerHTML=`<div class="card" style="text-align:center;color:var(--muted)">No hay GTI disponibles ahora.</div>`;return;}
  l.innerHTML=disp.map((d,i)=>`<div class="card chk ${sel.has(d.gti)?'sel':''}" onclick="tog('${d.gti}')">
    <div class="box">✓</div><div style="flex:1"><div class="gnum">GTI ${esc(d.gti)}</div><div class="gsuc">→ ${esc(d.sucursal||'—')}</div>
    <div class="gmeta">${d.bultos?`<span class="pill">${d.bultos} bultos</span>`:''}${d.nvi?`<span>NVI ${esc(d.nvi)}</span>`:''}</div></div></div>`).join('');
  actN();
}
function tog(g){ sel.has(g)?sel.delete(g):sel.add(g); scSelect(); renderNav(); }
function actN(){const n=sel.size;if($('#n'))$('#n').textContent=n;if($('#cont'))$('#cont').disabled=n===0;}

/* ===== RESUMEN + FOTO REFERENCIA (obligatoria) ===== */
let fotoRefFile=null;
function scResumen(){
  const elegidas=disp.filter(d=>sel.has(d.gti));
  const g={}; elegidas.forEach(d=>{(g[d.sucursal]=g[d.sucursal]||[]).push(d);});
  const sucs=Object.keys(g);
  const agregar=!!ruta; // ya hay ruta en curso -> se SUMAN a ella
  app().innerHTML=`<h2>${agregar?'Agregar GTI a la ruta':'Tu ruta de hoy'}</h2>
    <p class="sub">${agregar?`Se sumarán ${elegidas.length} GTI a tu ruta en curso.`:`Visitarás <b>${sucs.length} sucursal(es)</b> con ${elegidas.length} GTI.`}</p>
    ${sucs.map(s=>`<div class="suchead"><span class="sucdot" style="background:${SUC_COLOR[s]||'#64748B'}"></span><span class="sucname">${esc(s)}</span><span class="tag pend">${g[s].length} GTI</span></div>
      ${g[s].map(d=>`<div class="card"><div class="gnum">GTI ${esc(d.gti)}</div><div class="gmeta">${d.bultos?`<span class="pill">${d.bultos} bultos</span>`:''}</div></div>`).join('')}`).join('')}
    ${agregar?'':`<h2 style="margin-top:16px;font-size:15px">Foto de referencia de la carga <span style="color:var(--bad)">*</span></h2>
    <p class="sub" style="margin-bottom:8px">Obligatoria. Una foto del total de la mercadería que subes (solo referencia).</p>
    <label class="foto ${fotoRefFile?'ok':''}" id="fref" for="fileref">${fotoRefFile?'✓ Foto de referencia lista':'📷 Tomar foto de referencia'}</label>
    <input id="fileref" type="file" accept="image/*" capture="environment" class="hidden"/>`}
    <button class="btn ok" id="iniciar" onclick="${agregar?'agregarGtis()':'iniciarRuta()'}">${agregar?'➕ Agregar a la ruta':'📍 Registrar salida e iniciar ruta'}</button>
    <button class="btn ghost" onclick="go('select')">Volver a la selección</button>`;
  const fr=$('#fileref');
  if(fr) fr.onchange=(e)=>{fotoRefFile=e.target.files[0]||null;if(fotoRefFile){const u=URL.createObjectURL(fotoRefFile);const f=$('#fref');f.classList.add('ok');f.innerHTML='✓ Foto lista<br><img src="'+u+'">';}};
}
async function agregarGtis(){
  const b=$('#iniciar'); b.disabled=true; b.innerHTML='<span class="spin"></span>Agregando…';
  try{
    const elegidas=disp.filter(d=>sel.has(d.gti)).filter(d=>!tras.some(t=>t.gti===d.gti));
    if(!elegidas.length){ toast('Esas GTI ya están en tu ruta'); go('tareas'); return; }
    const filas=elegidas.map(d=>({ruta_id:ruta.id,gti:d.gti,sucursal:d.sucursal,nvi:d.nvi||null,bultos:d.bultos||null,estado:'en_ruta'}));
    const {error}=await sb.from('traslados').insert(filas); if(error) throw error;
    for(const d of elegidas){ try{ await sb.from('gti_disponibles').update({tomada:true}).eq('gti',d.gti); }catch(_){} }
    sel=new Set(); await cargarTraslados();
    toast(elegidas.length+' GTI agregada(s) a la ruta'); go('tareas');
  }catch(e){ toast('Error: '+e.message); b.disabled=false; b.textContent='➕ Agregar a la ruta'; }
}
async function iniciarRuta(){
  if(!fotoRefFile){ toast('La foto de referencia es obligatoria'); return; }
  const b=$('#iniciar'); b.disabled=true; b.innerHTML='<span class="spin"></span>Iniciando…';
  try{
    const g=await gps();
    const {data:r,error:e1}=await sb.from('rutas').insert({chofer_id:usuario.id,chofer_nombre:perfil.nombre,
      salida_ts:new Date().toISOString(),salida_lat:g.lat,salida_lon:g.lon,estado:'en_curso'}).select().single();
    if(e1) throw e1; ruta=r;
    // 1) Las GTI son lo ESENCIAL: se insertan primero, para no dejar rutas vacías.
    const elegidas=disp.filter(d=>sel.has(d.gti));
    const filas=elegidas.map(d=>({ruta_id:ruta.id,gti:d.gti,sucursal:d.sucursal,nvi:d.nvi||null,bultos:d.bultos||null,estado:'en_ruta'}));
    const {error:e2}=await sb.from('traslados').insert(filas); if(e2) throw e2;
    for(const d of elegidas){ try{ await sb.from('gti_disponibles').update({tomada:true}).eq('gti',d.gti); }catch(_){} }
    // 2) Foto de referencia: best-effort, NO debe tumbar la ruta si algo falla.
    try{ const fref=await subirFoto(fotoRefFile,'referencia'); await sb.from('rutas').update({foto_referencia_url:fref}).eq('id',ruta.id); }
    catch(fe){ console.warn('foto referencia no guardada:', fe.message); }
    sel=new Set(); fotoRefFile=null; await cargarTraslados();
    toast('Ruta iniciada'+(g.lat?' · GPS ok':'')); go('tareas');
  }catch(e){
    // Si la ruta se creó pero no alcanzó a cargar GTI, ciérrala para no dejarla huérfana.
    try{ if(ruta&&(!tras||!tras.length)){ await sb.from('rutas').update({estado:'cerrada',cierre_ts:new Date().toISOString()}).eq('id',ruta.id); ruta=null; } }catch(_){}
    toast('Error: '+e.message); b.disabled=false; b.textContent='📍 Registrar salida e iniciar ruta';
  }
}

/* ===== TAREAS (entregas por sucursal) ===== */
function scTareas(){
  if(!ruta){ go('home'); return; }
  const g=grupos(); const sucs=Object.keys(g);
  if(!sucs.length){
    app().innerHTML=`<div class="banner info">Esta ruta quedó activa pero <b>sin GTI cargadas</b>. Puedes cancelarla y empezar una nueva.</div>
      <button class="btn ghost" onclick="cancelarRuta()">Cancelar esta ruta</button>
      <button class="btn brand" onclick="go('select')">Iniciar una ruta nueva</button>`;
    return;
  }
  if(sucs.every(s=>sucEntregada(s))){ cerrarRuta(); return; }
  app().innerHTML=`<div class="banner ok">🚚 Ruta en curso · salida ${hora(ruta.salida_ts)}${ruta.salida_lat?' · GPS ok':''}</div>
    <h2>Entregas pendientes</h2><p class="sub">Toca “Entregar” al llegar a cada sucursal. Se agrupan sus GTI.</p>
    ${sucs.map(s=>{const done=sucEntregada(s);
      return `<div class="card">
        <div class="suchead" style="margin:0 0 8px"><span class="sucdot" style="background:${SUC_COLOR[s]||'#64748B'}"></span><span class="sucname">${esc(s)}</span><span class="tag ${done?'ok':'pend'}">${done?'ENTREGADA':g[s].length+' GTI'}</span></div>
        <div class="gmeta" style="margin-bottom:${done?'0':'10px'}">${g[s].map(t=>`<span class="pill">GTI ${esc(t.gti)}</span>`).join('')}</div>
        ${done?'':`<button class="btn ok" style="margin:0" onclick="go('entrega:${encodeURIComponent(s)}')">📦 Entregar en ${esc(s)}</button>`}
      </div>`;}).join('')}
    <button class="btn brand" style="margin-top:8px" onclick="go('select')">➕ Agregar más GTI a la ruta</button>
    <button class="btn ghost" onclick="cancelarRuta()">Cancelar ruta</button>`;
}
async function cancelarRuta(){
  if(!confirm('¿Cancelar esta ruta? Se cerrará sin completar las entregas pendientes.')) return;
  try{ await sb.from('rutas').update({estado:'cerrada',cierre_ts:new Date().toISOString()}).eq('id',ruta.id); }catch(_){}
  ruta=null; tras=[]; toast('Ruta cancelada'); go('home');
}

/* ===== ENTREGA POR SUCURSAL (1 foto + estado por GTI + estado sucursal) ===== */
let fotoEntFile=null;
function scEntrega(){
  const s=decodeURIComponent(vista.split(':')[1]||'');
  const items=grupos()[s]||[]; fotoEntFile=null;
  $('#topTit').textContent='Entregar · '+s;
  app().innerHTML=`<h2>Entregar en ${esc(s)}</h2><p class="sub">${items.length} GTI de esta sucursal. Registra la entrega.</p>
    <div class="banner info">Al confirmar se registra tu llegada (hora + GPS) y se cierran estas GTI.</div>
    <label>Foto de la entrega <span style="color:var(--bad)">*</span></label>
    <label class="foto" id="fe" for="fileent">📷 Tomar foto de la entrega</label>
    <input id="fileent" type="file" accept="image/*" capture="environment" class="hidden"/>
    <label>Recibe conforme (nombre)</label><input id="recibe" placeholder="Nombre de quien recibe"/>
    <label>Estado general de la sucursal</label>
    <select id="estadoSuc"><option>Todo conforme</option><option>Con observaciones</option></select>
    <h2 style="font-size:15px;margin-top:12px">Estado por GTI</h2>
    <div id="gtis">${items.map(t=>`<div class="gtibox" data-id="${t.id}">
      <div class="gnum">GTI ${esc(t.gti)} ${t.bultos?`<span class="pill">${t.bultos} bultos</span>`:''}</div>
      <select class="eg" style="margin:8px 0 6px"><option>Completa y conforme</option><option>Con faltantes</option><option>Con daños</option></select>
      <input class="og" placeholder="Observación (opcional)" style="margin:0"/></div>`).join('')}</div>
    <button class="btn ok" id="confirmar" onclick="confirmarEntrega('${encodeURIComponent(s)}')">Confirmar entrega en ${esc(s)}</button>
    <button class="btn ghost" onclick="go('tareas')">Volver a tareas</button>`;
  $('#fileent').onchange=(e)=>{fotoEntFile=e.target.files[0]||null;if(fotoEntFile){const u=URL.createObjectURL(fotoEntFile);$('#fe').classList.add('ok');$('#fe').innerHTML='✓ Foto lista<br><img src="'+u+'">';}};
}
async function confirmarEntrega(sEnc){
  const s=decodeURIComponent(sEnc);
  if(!fotoEntFile){ toast('La foto de la entrega es obligatoria'); return; }
  const b=$('#confirmar'); b.disabled=true; b.innerHTML='<span class="spin"></span>Registrando…';
  try{
    const g=await gps();
    const fpath=await subirFoto(fotoEntFile,'entrega_'+s.replace(/\s+/g,'_'));
    const recibe=$('#recibe').value.trim()||null, estadoSuc=$('#estadoSuc').value;
    const ts=new Date().toISOString();
    const cajas=[...document.querySelectorAll('#gtis .gtibox')];
    for(const c of cajas){
      const id=c.dataset.id, em=c.querySelector('.eg').value, ob=c.querySelector('.og').value.trim()||null;
      const {error}=await sb.from('traslados').update({
        llegada_ts:ts,llegada_lat:g.lat,llegada_lon:g.lon,foto_recepcion_url:fpath,
        recibido_por:recibe,estado_sucursal:estadoSuc,estado_merc:em,incidencia:ob,
        estado:'recepcionado',actualizado_en:ts}).eq('id',id);
      if(error) throw error;
    }
    await cargarTraslados();
    toast('Entrega en '+s+' registrada'); go('tareas');
  }catch(e){ toast('Error: '+e.message); b.disabled=false; b.textContent='Confirmar entrega'; }
}

/* ===== CIERRE ===== */
async function cerrarRuta(){
  if(ruta.estado!=='cerrada'){ try{ await sb.from('rutas').update({estado:'cerrada',cierre_ts:new Date().toISOString()}).eq('id',ruta.id); }catch(_){} }
  scCierre();
}
function scCierre(){
  $('#topTit').textContent='Ruta completada';
  const g=grupos(); const sucs=Object.keys(g);
  app().innerHTML=`<div class="banner ok">✓ ¡Ruta completada! Todas las entregas registradas.</div>
    <h2>Resumen de la tarea</h2><p class="sub">${tras.length} GTI entregadas en ${sucs.length} sucursal(es).</p>
    ${sucs.map(s=>`<div class="card"><div class="suchead" style="margin:0 0 6px"><span class="sucdot" style="background:${SUC_COLOR[s]||'#64748B'}"></span><span class="sucname">${esc(s)}</span><span class="tag ok">✓ ${hora(g[s][0].llegada_ts)}</span></div>
      <div class="gmeta">${g[s].map(t=>`<span class="pill">GTI ${esc(t.gti)}${t.estado_merc&&t.estado_merc!=='Completa y conforme'?' ⚠':''}</span>`).join('')}<span>📷 entrega</span></div></div>`).join('')}
    <div class="card" style="background:var(--brand-l);border-color:#BBD5F0"><div class="gmeta"><span>📷 Foto de referencia grupal</span><span>·</span><span>Salida ${hora(ruta.salida_ts)}</span></div></div>
    <button class="btn brand" onclick="nuevaRuta()">🏠 Volver al menú principal</button>`;
}
function nuevaRuta(){ ruta=null; tras=[]; go('home'); }

init();
</script>
</body>
</html>
