workflows:
  fitalia-apk:
    name: Fitalia Traslados APK
    max_build_duration: 60
    environment:
      node: 20
      java: 17
    scripts:
      - name: Instalar dependencias
        script: npm install
      - name: Agregar plataforma Android
        script: npx cap add android || echo "android ya existe"
      - name: Sincronizar
        script: npx cap sync android
      - name: Permisos de ubicacion GPS
        script: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q ACCESS_FINE_LOCATION "$MANIFEST"; then
            sed -i.bak 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n</manifest>#' "$MANIFEST"
          fi
          echo "----- AndroidManifest.xml -----"
          cat "$MANIFEST"
      - name:
