workflows:
  fitalia-apk:
    name: Fitalia Traslados APK
    max_build_duration: 60
    environment:
      node: 20
      java: 17
    scripts:
      - name: Instalar dependencias
        script: npm install
      - name: Agregar plataforma Android
        script: npx cap add android || echo "android ya existe"
      - name: Sincronizar
        script: npx cap sync android
      - name: Permiso de ubicacion
        script: grep -q ACCESS_FINE_LOCATION android/app/src/main/AndroidManifest.xml || sed -i.bak 's|</manifest>|<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/></manifest>|' android/app/src/main/AndroidManifest.xml
      - name: Compilar APK debug
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
